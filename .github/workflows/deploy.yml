name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Always keep the built site, so it can be downloaded and uploaded by hand if needed.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true # keeps .htaccess
          retention-days: 14

      # Upload to the server over FTP. Turned on by the repository variable DEPLOY_ENABLED=true
      # (see docs/DEPLOY.md). Only runs for pushes to main, never for pull requests.
      - name: Deploy to server (FTP)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || './' }}
          # Never touch the form's private config or stored enquiries on the server.
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php
            api/_data/**
